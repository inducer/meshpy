name: Build wheels
# inspired by: https://github.com/pypa/cibuildwheel/blob/main/examples/github-deploy.yml

on:
  push:
    branches:
    - main
    tags:
    - v*
  pull_request:
  release:
    types: [created]

jobs:
  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Build sdist
        run: pipx run build --sdist

      - uses: actions/upload-artifact@v7
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15-intel, macos-14]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.4.1
        env:
          CIBW_SKIP: "*-musllinux_i686 *-manylinux_i686 *-win32 cp31?t-*"
          # Make the Windows wheels self-contained. cibuildwheel repairs Linux
          # (auditwheel) and macOS (delocate) wheels by default, but does
          # nothing on Windows. The extension is built with MinGW, so the wheel
          # otherwise ships without its runtime DLLs (libstdc++-6.dll,
          # libgcc_s_seh-1.dll) and fails to import on a clean Windows Python
          # ("DLL load failed while importing _internals"). delvewheel bundles
          # them. See https://github.com/inducer/meshpy/issues/150
          CIBW_BEFORE_BUILD_WINDOWS: "pip install delvewheel"
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: "delvewheel repair -w {dest_dir} {wheel}"

      - uses: actions/upload-artifact@v7
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl

  deploy:
    needs: [build_sdist, build_wheels]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    name: Deploy
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v6
      - name: download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - name: deploy
        uses: pypa/gh-action-pypi-publish@v1.14.0
