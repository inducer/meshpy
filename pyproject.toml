[build-system]
build-backend = "mesonpy"
requires = [
    "meson-python",
    "numpy",
    "wheel",
    "pybind11",
]

[project]
name = "meshpy"
version = "2026.1"
description = "Triangular and Tetrahedral Mesh Generator"
readme= "README.rst"
license-files = ["LICENSE"]
authors = [{ name = "Andreas Kloeckner", email = "inform@tiker.net" }]
maintainers = [{ name = "Andreas Kloeckner", email = "inform@tiker.net" }]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Other Audience",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Programming Language :: C++",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "numpy",
]

[project.optional-dependencies]
doc = [
    "furo",
    "sphinx>=4",
    "sphinx-copybutton",
]
test = [
    "mako",
    "pytest",
    "ruff",
]

[project.urls]
Documentation = "https://documen.tician.de/meshpy"
Repository = "https://github.com/inducer/meshpy"

[tool.ruff.lint]
preview = true
extend-select = [
    "B",    # flake8-bugbear
    "C",    # flake8-comprehensions
    "E",    # pycodestyle
    "F",    # pyflakes
    "G",    # flake8-logging-format
    "I",    # flake8-isort
    "N",    # pep8-naming
    "NPY",  # numpy
    "Q",    # flake8-quotes
    "RUF",  # ruff
    "UP",   # pyupgrade
    "W",    # pycodestyle
]
extend-ignore = [
    "C90",  # McCabe complexity
    "missing-whitespace-around-arithmetic-operator",
    "multiple-spaces-after-comma",
    "tab-after-comma",
    "no-space-after-block-comment",
    "module-import-not-at-top-of-file",
]

[tool.ruff.lint.per-file-ignores]
"test/test_*.py" = ["exec-builtin"]
"doc/conf.py" = ["exec-builtin", "call-datetime-today"]
"examples/jw_meshtools.py" = ["invalid-function-name", "invalid-argument-name", "non-lowercase-variable-in-function"]
"examples/jw_mesh_examples.ipynb" = ["invalid-function-name", "invalid-argument-name", "non-lowercase-variable-in-function", "mixed-case-variable-in-global-scope"]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "double"
docstring-quotes = "double"
multiline-quotes = "double"

[tool.ruff.lint.isort]
known-local-folder = ["pyfmmlib"]
lines-after-imports = 2
combine-as-imports = true
